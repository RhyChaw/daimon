<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#030308">
<title>Daimon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Inter:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/xterm.css">
<script type="importmap">
{ "imports": { "three": "/three.module.js" } }
</script>
<style>
/* ── Reset ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; -webkit-text-size-adjust: none; text-size-adjust: none; }

:root {
  --bg: #030308;
  --text: #d2d8f0;
  --text-dim: rgba(180,185,220,0.34);
  --orb: 250px;
  --stage: 380px;
  --mote-r: 112px;
  --font-display: 'Syne', system-ui, sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;
}
@media (max-width: 480px) {
  :root { --orb: 190px; --stage: 290px; --mote-r: 86px; }
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  position: relative;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 72% 56% at 50% 36%,
    rgba(18,24,72,0.32) 0%, transparent 68%);
  pointer-events: none; z-index: 0;
}

/* ── Status row (connection + model selector, centered above the input) ──── */
#status-row {
  align-self: center; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 7px; margin: 0 auto 8px; z-index: 2;
}
#conn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 11px 3px 9px; border-radius: 999px;
  font-family: var(--font-body);
  font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
  background: rgba(255,70,70,0.08);
  border: 1px solid rgba(255,70,70,0.26);
  color: rgba(255,150,150,0.80);
  transition: background 0.5s, border-color 0.5s, color 0.5s;
  user-select: none;
}

/* ── Model selector pill ────────────────────────────────────────────────── */
#model-pill {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px 3px 9px; border-radius: 999px;
  background: rgba(120,110,245,0.10);
  border: 1px solid rgba(130,120,245,0.30);
  transition: background 0.3s, border-color 0.3s;
}
#model-pill:hover { background: rgba(120,110,245,0.16); border-color: rgba(130,120,245,0.45); }
#model-pill::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: #8b7bff; box-shadow: 0 0 6px rgba(139,123,255,0.8);
  flex-shrink: 0;
}
#model-pill::after {
  content: '▾'; font-size: 9px; line-height: 1;
  color: rgba(180,175,255,0.6); pointer-events: none; margin-left: -2px;
}
#model-select {
  -webkit-appearance: none; appearance: none;
  background: transparent; border: none; outline: none;
  font-family: var(--font-body);
  font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
  color: rgba(190,185,255,0.92);
  padding: 0 2px 0 0; cursor: pointer;
}
#model-select option { color: #1a1a2e; background: #e8e9f5; }
#conn::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,70,70,0.7);
  transition: background 0.5s, box-shadow 0.5s;
}
#conn::after { content: 'Offline'; }
#conn.ok {
  background: rgba(50,205,110,0.10);
  border-color: rgba(50,205,110,0.34);
  color: rgba(120,235,165,0.92);
}
#conn.ok::before {
  background: #2ecd6e;
  box-shadow: 0 0 7px rgba(46,205,110,0.85);
  animation: conn-pulse 2.2s ease-in-out infinite;
}
#conn.ok::after { content: 'Connected'; }
@keyframes conn-pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

/* ── Wordmark ───────────────────────────────────────────────────────────── */
#wordmark {
  font-family: var(--font-display);
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.30em; text-transform: uppercase;
  color: rgba(150,160,210,0.18);
  padding-top: max(20px, env(safe-area-inset-top, 20px));
  flex-shrink: 0; z-index: 1; user-select: none;
}

/* ── Stage ──────────────────────────────────────────────────────────────── */
#stage {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px; position: relative; z-index: 1;
  transition: flex 0.35s ease, min-height 0.35s ease;
}
body.term-active #stage {
  flex: 0 0 auto;
  min-height: 0;
  gap: 10px;
  padding-bottom: 4px;
}
body.term-active { --orb: 72px; --stage: 120px; --mote-r: 32px; }

#orb-outer {
  width: var(--stage); height: calc(var(--stage) * 1.12);
  position: relative;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: width 0.35s ease, height 0.35s ease;
}
/* Soft state-coloured glow behind the hologram (the model itself isn't round). */
#orb-glow {
  position: absolute; left: 50%; top: 50%;
  width: var(--orb); height: var(--orb);
  margin: calc(var(--orb) * -0.5) 0 0 calc(var(--orb) * -0.5);
  border-radius: 50%; z-index: 1; pointer-events: none;
  will-change: box-shadow;
}
#orb-canvas {
  width: calc(var(--orb) * 1.15); height: calc(var(--orb) * 1.7);
  position: relative; z-index: 2;
  will-change: transform;
  transform-origin: center;
  cursor: default;
  transition: width 0.35s ease, height 0.35s ease;
}
#orb-canvas.no-webgl {
  width: var(--orb); height: var(--orb); border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, #5577ff, #1122aa);
  box-shadow: 0 0 55px 18px rgba(68,100,255,0.40),
              0 0 110px 44px rgba(68,100,255,0.14);
  animation: css-breathe 3.2s ease-in-out infinite;
}
@keyframes css-breathe { 0%,100%{transform:scale(1);}50%{transform:scale(1.04);} }

/* ── Motes ──────────────────────────────────────────────────────────────── */
.mote {
  position: absolute; width: 4px; height: 4px;
  border-radius: 50%; background: rgba(175,95,255,0.75);
  top: 50%; left: 50%; margin: -2px 0 0 -2px;
  opacity: 0; pointer-events: none; z-index: 1;
  box-shadow: 0 0 6px 2px rgba(175,95,255,0.55);
  transition: opacity 0.9s ease;
}
#orb-outer.moteing .mote { opacity: 1; }
.mote:nth-child(1){ animation: orb1 4.8s linear infinite; }
.mote:nth-child(2){ animation: orb2 6.0s linear infinite; animation-delay:-2.0s; }
.mote:nth-child(3){ animation: orb3 3.9s linear infinite; animation-delay:-1.0s; }
@keyframes orb1 {
  0%  { transform:rotate(0deg)   translateX(var(--mote-r)) scale(1.0); }
  50% { transform:rotate(180deg) translateX(var(--mote-r)) scale(0.7); }
  100%{ transform:rotate(360deg) translateX(var(--mote-r)) scale(1.0); }
}
@keyframes orb2 {
  0%  { transform:rotate(120deg) translateX(calc(var(--mote-r)*1.1)) scale(0.8); }
  50% { transform:rotate(300deg) translateX(calc(var(--mote-r)*1.1)) scale(1.1); }
  100%{ transform:rotate(480deg) translateX(calc(var(--mote-r)*1.1)) scale(0.8); }
}
@keyframes orb3 {
  0%  { transform:rotate(240deg) translateX(calc(var(--mote-r)*.88)) scale(1.2); }
  50% { transform:rotate(420deg) translateX(calc(var(--mote-r)*.88)) scale(0.6); }
  100%{ transform:rotate(600deg) translateX(calc(var(--mote-r)*.88)) scale(1.2); }
}

/* ── State label ────────────────────────────────────────────────────────── */
#state-label {
  font-family: var(--font-display);
  font-size: 10px; font-weight: 400;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(160,170,220,0.0);
  transition: color 0.55s ease;
  min-height: 14px; user-select: none;
}
#state-label.visible { color: rgba(155,165,215,0.38); }

/* ── Action chips ───────────────────────────────────────────────────────── */
#chips {
  display: flex; flex-wrap: wrap;
  justify-content: center; gap: 6px;
  min-height: 26px; max-width: 320px;
}
.chip {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 12px 4px 9px; border-radius: 999px;
  font-family: var(--font-body);
  font-size: 10.5px; font-weight: 500; letter-spacing: 0.03em;
  opacity: 0; transform: translateY(7px) scale(0.92);
  animation: chip-in 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;
  white-space: nowrap;
}
@keyframes chip-in { to { opacity:1; transform:translateY(0) scale(1); } }
.chip::before { content:''; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.chip-auto {
  background: rgba(68,110,240,0.09); border: 1px solid rgba(68,110,240,0.26);
  color: rgba(140,158,255,0.88);
}
.chip-auto::before { background:#5577ee; box-shadow:0 0 5px rgba(68,110,240,0.9); }
.chip-confirm {
  background: rgba(240,138,38,0.09); border: 1px solid rgba(240,138,38,0.30);
  color: rgba(255,182,100,0.92);
}
.chip-confirm::before { background:#f08820; box-shadow:0 0 5px rgba(240,138,38,0.9); }

/* ── Gate overlay ───────────────────────────────────────────────────────── */
#gate-overlay {
  position: fixed; inset: 0;
  background: rgba(2,2,6,0.76);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100;
}
#gate-overlay.visible { display: flex; animation: gate-bg-in 0.28s ease; }
@keyframes gate-bg-in { from{opacity:0;} to{opacity:1;} }
#gate-card {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding: 36px 40px 30px; border-radius: 26px;
  background: rgba(14,14,22,0.88);
  border: 1px solid rgba(240,138,38,0.24);
  box-shadow: 0 0 55px rgba(240,138,38,0.10),
              0 28px 72px rgba(0,0,0,0.55),
              inset 0 1px 0 rgba(255,255,255,0.04);
  max-width: 288px; width: calc(100% - 48px);
  animation: gate-card-in 0.36s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes gate-card-in {
  from { opacity:0; transform: scale(0.86) translateY(14px); }
  to   { opacity:1; transform: scale(1)    translateY(0); }
}
.gate-ring {
  width: 54px; height: 54px; border-radius: 50%;
  border: 1.5px solid rgba(240,138,38,0.42);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: rgba(255,178,78,0.92);
  box-shadow: 0 0 22px rgba(240,138,38,0.18), inset 0 0 14px rgba(240,138,38,0.08);
  animation: gate-ring-pulse 1.9s ease-in-out infinite;
}
@keyframes gate-ring-pulse {
  0%,100% { box-shadow: 0 0 22px rgba(240,138,38,0.18), inset 0 0 14px rgba(240,138,38,0.08); }
  50%      { box-shadow: 0 0 38px rgba(240,138,38,0.38), inset 0 0 20px rgba(240,138,38,0.16); }
}
#gate-action {
  font-family: var(--font-display); font-size: 14.5px; font-weight: 600;
  color: rgba(240,242,255,0.90); text-align: center; line-height: 1.4; letter-spacing: 0.01em;
}
.gate-hint { font-size: 12px; font-weight: 300; color: rgba(180,185,220,0.42); text-align: center; line-height: 1.5; }

/* ── Transcript ─────────────────────────────────────────────────────────── */
#transcript {
  width: 100%; max-width: 510px;
  padding: 0 26px;
  max-height: 26vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
  scrollbar-width: none; flex-shrink: 0; z-index: 1;
  transition: max-height 0.35s ease, opacity 0.35s ease;
}
body.term-active #transcript { max-height: 0; opacity: 0; pointer-events: none; }
#transcript::-webkit-scrollbar { display: none; }
.msg { font-size: 13.5px; line-height: 1.62; opacity: 0; transform: translateY(5px); animation: msg-in 0.3s ease forwards; }
@keyframes msg-in { to { opacity:1; transform:translateY(0); } }
.msg-user { color: var(--text-dim); text-align: right; font-size: 13px; font-weight: 300; }
.msg-daimon { color: rgba(215,225,255,0.88); font-weight: 300; }

/* ── Terminal ───────────────────────────────────────────────────────────── */
/* Deliberately not a card: no border, no header bar, no fill. Terminal output
   sits directly on the page background, so the session reads as part of Daimon
   rather than as another product embedded in a window. The panel's own fill is
   only half of that — _TERM_THEME.background carries the rest, and is
   transparent for the same reason. */
#term-panel {
  width: 100%; max-width: 900px;
  flex: 0 0 0px; overflow: hidden;
  display: flex; flex-direction: column;
  z-index: 2;
  transition: flex-basis 0.35s ease;
}
#term-panel.visible { flex: 1 1 0; min-height: 200px; }

/* The mask belongs on the container, not .xterm-viewport: the viewport is the
   scroller, so a mask there would travel with the content instead of holding
   the fade at the top edge. Output fades in as it scrolls rather than being
   cut off by a hard line. */
#term-container {
  flex: 1; overflow: hidden;
  padding: 4px 6px 2px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 32px);
          mask-image: linear-gradient(to bottom, transparent 0, #000 32px);
}
/* xterm.js overrides */
#term-container .xterm { height: 100%; }
#term-container .xterm-viewport {
  overflow-y: scroll !important;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.10) transparent;
}
#term-container .xterm-viewport::-webkit-scrollbar { width: 4px; }
#term-container .xterm-viewport::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.10); border-radius: 2px;
}

/* ── Input bar ──────────────────────────────────────────────────────────── */
#input-bar {
  width: 100%; max-width: 510px;
  padding: 10px 18px max(20px, env(safe-area-inset-bottom, 20px));
  display: flex; align-items: flex-end; gap: 8px;
  flex-shrink: 0; z-index: 1;
}
#input {
  flex: 1;
  background: rgba(255,255,255,0.046);
  border: 1px solid rgba(255,255,255,0.076);
  border-radius: 18px;
  color: var(--text);
  font-family: var(--font-body); font-size: 15px; font-weight: 400;
  padding: 10px 18px; outline: none;
  transition: border-color 0.24s, background 0.24s;
  caret-color: #7799ff;
  -webkit-appearance: none; appearance: none;
  resize: none; overflow-y: auto; overflow-x: hidden;
  line-height: 1.5; min-height: 42px; max-height: 160px;
  scrollbar-width: none;
}
#input::-webkit-scrollbar { display: none; }
#input:focus { border-color: rgba(95,135,255,0.32); background: rgba(255,255,255,0.066); }
#input::placeholder { color: rgba(255,255,255,0.13); }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid rgba(95,125,255,0.20);
  background: rgba(55,75,200,0.09);
  color: rgba(135,155,255,0.62);
  font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, border-color 0.2s, transform 0.12s;
  flex-shrink: 0; -webkit-tap-highlight-color: transparent;
  line-height: 1; user-select: none;
}
.icon-btn:hover { background: rgba(55,75,200,0.18); border-color: rgba(95,125,255,0.38); }
.icon-btn:active { transform: scale(0.87); }
.icon-btn svg { width: 18px; height: 18px; display: block; }
#mic-btn { color: rgba(150,165,255,0.55); }
#mic-btn:hover { color: rgba(170,185,255,0.85); }
#mic-btn.recording {
  color: #ff6b6b; border-color: rgba(255,90,90,0.55);
  background: rgba(255,70,70,0.14);
  animation: mic-pulse 1.5s ease-in-out infinite;
}
@keyframes mic-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,80,80,0.45); }
  50%     { box-shadow: 0 0 0 6px rgba(255,80,80,0); }
}
/* Send is the primary action — solid accent fill */
#send-btn {
  background: linear-gradient(150deg, #5d7bff, #3a52d8);
  border-color: transparent; color: #fff;
  box-shadow: 0 3px 12px rgba(70,95,230,0.35);
}
#send-btn:hover { background: linear-gradient(150deg, #6f8aff, #455fe6); border-color: transparent; }
#send-btn svg { width: 17px; height: 17px; }
</style>
</head>
<body>

<p id="wordmark">Daimon</p>

<!-- Gate -->
<div id="gate-overlay">
  <div id="gate-card">
    <div class="gate-ring">⊛</div>
    <div id="gate-action">Confirm action</div>
    <div class="gate-hint">Touch ID or password to continue</div>
  </div>
</div>

<!-- Orb -->
<div id="stage">
  <div id="orb-outer">
    <div id="orb-glow"></div>
    <canvas id="orb-canvas"></canvas>
    <div class="mote"></div>
    <div class="mote"></div>
    <div class="mote"></div>
  </div>
  <div id="state-label"></div>
  <div id="chips"></div>
</div>

<!-- Terminal (hidden until term_open; no chrome — see #term-panel) -->
<div id="term-panel">
  <div id="term-container"></div>
</div>

<!-- Transcript -->
<div id="transcript"></div>

<!-- Status row: connection + model selector (centered, just above the input) -->
<div id="status-row">
  <div id="conn"></div>
  <div id="model-pill">
    <select id="model-select" aria-label="Model">
      <option value="claude">Claude</option>
      <option value="ollama">Ollama</option>
    </select>
  </div>
</div>

<!-- Input (Daimon commands) -->
<div id="input-bar">
  <textarea id="input" placeholder="Ask Daimon something…" rows="1"
            autocomplete="off" autocorrect="off" spellcheck="false"
            enterkeyhint="send"></textarea>
  <button class="icon-btn" id="mic-btn" aria-label="Voice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="12" rx="3"></rect>
      <path d="M5 11a7 7 0 0 0 14 0"></path>
      <line x1="12" y1="18" x2="12" y2="22"></line>
    </svg>
  </button>
  <button class="icon-btn" id="send-btn" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="20" x2="12" y2="5"></line>
      <path d="M5 12l7-7 7 7"></path>
    </svg>
  </button>
</div>

<script src="/xterm.js"></script>
<script src="/xterm-addon-fit.js"></script>
<script type="module">
"use strict";
import * as THREE from "three";
import { GLTFLoader } from "/GLTFLoader.js";
import { RoomEnvironment } from "/RoomEnvironment.js";

const WS_URL = `ws://${location.hostname}:8765`;

// ── DOM refs ─────────────────────────────────────────────────────────────────
const canvas        = document.getElementById("orb-canvas");
const chipsEl       = document.getElementById("chips");
const txEl          = document.getElementById("transcript");
const inputEl       = document.getElementById("input");
const sendBtn       = document.getElementById("send-btn");
const micBtn        = document.getElementById("mic-btn");
const gateEl        = document.getElementById("gate-overlay");
const gateAction    = document.getElementById("gate-action");
const connDot       = document.getElementById("conn");
const stateLabel    = document.getElementById("state-label");
const orbOuter      = document.getElementById("orb-outer");
const orbGlow       = document.getElementById("orb-glow");
const modelSelect   = document.getElementById("model-select");
const termPanelEl   = document.getElementById("term-panel");
const termContainer = document.getElementById("term-container");

// ── xterm.js (lazy — never crashes the orb if CDN is slow/unreachable) ────────
let term = null;
let fitAddon = null;
let termMounted = false;
let termActivityTimer = null;

const _TERM_THEME = {
  // Transparent, not near-black: xterm paints this behind every row, so an
  // opaque value here is a rectangle of slightly-wrong black over the page
  // background — the thing that still reads as "embedded window" after the
  // panel's own fill is gone. allowTransparency below is what makes it work.
  background:          "rgba(0,0,0,0)",
  foreground:          "#d2d8f0",
  cursor:              "#7799ff",
  cursorAccent:        "#030308",
  selectionBackground: "rgba(95,135,255,0.22)",

  // Daimon's palette, not the default 16-colour table. The interface is cold —
  // #030308 ground, #d2d8f0 text, #5d7bff accent — and the terminal was sitting
  // in it with warm yellows and a terminal green, which is most of why the
  // session read as somebody else's software.
  //
  //   cyan family  output, paths, structure — the default voice of the panel
  //   blue         prompts and cursors, the existing #5d7bff/#7799ff accent
  //   amber        warnings only. Nothing routine gets to be amber, or the one
  //                colour that should mean "look at this" stops meaning it.
  //   red          errors. Cooled off the stock red so it belongs to this
  //                interface, still unmistakably red.
  //   green        kept as teal: diff additions must stay readable as additions,
  //                but terminal green is the single warmest thing on screen.
  black:   "#10131f", red:     "#ff5c72", green:   "#35d6bc", yellow:  "#f0a830",
  blue:    "#6f8aff", magenta: "#b48cff", cyan:    "#74d0f0", white:   "#d2d8f0",
  // brightBlack carries dim text — line numbers, stack frames, secondary
  // detail. A stack frame under an error is often the most useful text on
  // screen, so this gets read, not glanced past. Legibility wins over hierarchy
  // where they conflict: still clearly subordinate to #d2d8f0, but no squinting.
  brightBlack:   "#6e7a9e", brightRed:     "#ff8497", brightGreen:   "#5ce8cf",
  brightYellow:  "#ffc65c", brightBlue:    "#8fa6ff", brightMagenta: "#cba6ff",
  brightCyan:    "#a8e6ff", brightWhite:   "#ffffff",
};

function _mountTerm() {
  if (termMounted) return;
  termMounted = true;
  if (typeof Terminal === "undefined" || typeof FitAddon === "undefined") {
    termContainer.innerHTML =
      '<p style="padding:20px;color:rgba(255,80,80,0.55);font-family:monospace;font-size:12px">' +
      'xterm.js failed to load — check network connectivity.</p>';
    return;
  }
  term = new Terminal({
    theme: _TERM_THEME,
    fontFamily: '"JetBrains Mono","Cascadia Code","Fira Code","Menlo",monospace',
    fontSize: 13, lineHeight: 1.38,
    cursorStyle: "bar", cursorBlink: true,
    scrollback: 5000, allowTransparency: true, convertEol: false,
  });
  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(termContainer);
  term.onData(data => {
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({ type: "term_in", data }));
  });
  new ResizeObserver(() => {
    if (termPanelEl.classList.contains("visible")) {
      try { fitAddon.fit(); } catch(_) {}
      _sendResize();
    }
  }).observe(termContainer);
}

function _sendResize() {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({
      type: "term_resize",
      cols: term ? term.cols : 80,
      rows: term ? term.rows : 24,
    }));
}

function _openTerm() {
  _mountTerm();
  document.body.classList.add("term-active");
  termPanelEl.classList.add("visible");
  setTimeout(() => {
    if (fitAddon) try { fitAddon.fit(); } catch(_) {}
    _sendResize();
    resizeCanvas();
  }, 380);
}

// The terminal is permanent now — no close affordance, and a dead session shows
// as state rather than by the panel vanishing. So this only stops the activity
// timer and drops the orb to idle; the panel itself stays where it is.
function _closeTerm() {
  clearTimeout(termActivityTimer);
  daimon.setState("idle");
}

// ── three.js globe (the holographic earth GLB) ────────────────────────────────
// The model is a self-illuminated hologram: an emissive earth surface plus a
// bright cyan "rays" shell that projects a beam downward. We render it faithfully
// (no tone-mapping crush) and drive daimon state via its emissive colour.
let renderer=null, scene=null, camera=null, mixer=null, globeHolder=null;
let shellMat=null, surfMat=null, glReady=false;
const _clock=new THREE.Clock();

function initGL() {
  try {
    renderer=new THREE.WebGLRenderer({
      canvas, alpha:true, antialias:true, powerPreference:"default",
    });
  } catch(_) { return false; }
  if(!renderer) return false;
  renderer.setClearColor(0x000000,0);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.NoToneMapping;   // emissive hologram — don't crush it

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(34,1,0.1,100);
  camera.position.set(0,0,3.9);

  // Subtle image-based light so the earth's base-colour map reads; the cyan shell
  // is emissive and lights itself.
  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

  globeHolder=new THREE.Group();
  scene.add(globeHolder);

  new GLTFLoader().load("/globe.glb", gltf=>{
    const model=gltf.scene;                    // globe sits at world origin (r≈0.64);
    model.traverse(o=>{                         // the rays/beam hang below it.
      if(!o.isMesh) return;
      const m=o.material;
      if(/transparent/i.test(m.name||"")) shellMat=m; else surfMat=m;
    });
    globeHolder.add(model);
    // wide in the horizontal plane (x & z together → no wobble when spinning),
    // a touch shorter vertically.
    globeHolder.scale.set(1.45*1.32, 1.45*0.92, 1.45*1.32);

    if(gltf.animations && gltf.animations.length){
      mixer=new THREE.AnimationMixer(model);
      gltf.animations.forEach(c=>mixer.clipAction(c).play());
    }
  }, undefined, err=>{ console.warn("globe.glb load failed",err); });

  return true;
}

function resizeCanvas() {
  if(!renderer) return;
  const w=canvas.clientWidth||parseFloat(getComputedStyle(canvas).width)||180;
  const h=canvas.clientHeight||w;
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}

// ── State params ──────────────────────────────────────────────────────────────
const ST = {
  idle:     {c1:[.27,.50,1.], c2:[.06,.13,.60], cr:[.56,.78,1.], turb:.09, spd:.13, rim:.55, pulseAmp:.026,pulsePer:3400,scale:1.00,motes:false, bRGB:[68,110,255], bA:.34,bR:52,bfA:.11,bfR:98},
  listening:{c1:[.18,.94,.55], c2:[.04,.37,.22], cr:[.44,.98,.64], turb:.27, spd:.37, rim:.47, pulseAmp:.036,pulsePer:1600,scale:1.024,motes:false, bRGB:[50,210,120], bA:.42,bR:58,bfA:.13,bfR:108},
  thinking: {c1:[.60,.18,1.], c2:[.17,.05,.57], cr:[.88,.47,1.], turb:.68, spd:.70, rim:.64, pulseAmp:.046,pulsePer:950, scale:1.00,motes:true,  bRGB:[145,55,255],  bA:.42,bR:63,bfA:.14,bfR:118},
  acting:   {c1:[.08,.87,1.], c2:[.01,.27,.57], cr:[.27,.94,1.], turb:.44, spd:.51, rim:.51, pulseAmp:.036,pulsePer:760, scale:1.014,motes:false, bRGB:[28,195,240],  bA:.47,bR:60,bfA:.15,bfR:112},
  speaking: {c1:[1.,.80,.22], c2:[.64,.31,.02], cr:[1.,.91,.54], turb:.21, spd:.31, rim:.47, pulseAmp:.050,pulsePer:1200,scale:1.01,motes:false, bRGB:[255,188,38],  bA:.47,bR:66,bfA:.15,bfR:122},
  gate:     {c1:[1.,.51,.10], c2:[.57,.15,.02], cr:[1.,.71,.21], turb:.05, spd:.07, rim:.80, pulseAmp:.016,pulsePer:2200,scale:.940,motes:false,  bRGB:[240,118,28],  bA:.58,bR:36,bfA:.20,bfR:68},
};

function cloneState(s){return{c1:[...s.c1],c2:[...s.c2],cr:[...s.cr],turb:s.turb,spd:s.spd,rim:s.rim,scale:s.scale,bRGB:[...s.bRGB],bA:s.bA,bR:s.bR,bfA:s.bfA,bfR:s.bfR};}
const cur=cloneState(ST.idle);
let tgtName="idle", prevName="idle";
let nudgePos=0, nudgeVel=0, focusBoost=0;
const T0=performance.now();

function springNudge(v){nudgeVel+=v;}
function settleNudge(){nudgeVel-=0.028;}

function applyStateExtras(name) {
  const s=ST[name];
  orbOuter.classList.toggle("moteing",s.motes);
  if(name==="idle"){stateLabel.classList.remove("visible");}
  else{stateLabel.textContent=name;stateLabel.classList.add("visible");}
  if(name==="idle"&&prevName!=="idle")settleNudge();
}

// ── Draw loop ─────────────────────────────────────────────────────────────────
const LR=0.065;
function lv(a,b,t){for(let i=0;i<a.length;i++)a[i]+=(b[i]-a[i])*t;}
function ln(a,b,t){return a+(b-a)*t;}

function draw(now) {
  requestAnimationFrame(draw);
  const t=(now-T0)/1000, tgt=ST[tgtName];
  lv(cur.c1,tgt.c1,LR);lv(cur.c2,tgt.c2,LR);lv(cur.cr,tgt.cr,LR);
  cur.turb=ln(cur.turb,tgt.turb,LR*.78);
  cur.spd =ln(cur.spd, tgt.spd, LR*.70);
  cur.rim =ln(cur.rim, tgt.rim, LR);
  cur.scale=ln(cur.scale,tgt.scale,LR);
  lv(cur.bRGB,tgt.bRGB,LR*.8);
  cur.bA=ln(cur.bA,tgt.bA,LR);cur.bR=ln(cur.bR,tgt.bR,LR);
  cur.bfA=ln(cur.bfA,tgt.bfA,LR);cur.bfR=ln(cur.bfR,tgt.bfR,LR);

  const breathe=Math.sin(t*2*Math.PI/(tgt.pulsePer/1000))*tgt.pulseAmp;
  const SPRING=26,DAMP=5.8,DT=0.016;
  nudgeVel+=(-nudgePos*SPRING-nudgeVel*DAMP)*DT;
  nudgePos+=nudgeVel*DT;
  focusBoost=ln(focusBoost,0,.07);

  const totalScale=cur.scale+breathe+nudgePos+focusBoost*.014;
  canvas.style.transform=`scale(${totalScale.toFixed(4)})`;

  const[r,g,b]=cur.bRGB.map(v=>Math.round(v));
  orbGlow.style.boxShadow=[
    `0 0 ${cur.bR.toFixed(1)}px ${(cur.bR*.28).toFixed(1)}px rgba(${r},${g},${b},${cur.bA.toFixed(3)})`,
    `0 0 ${cur.bfR.toFixed(1)}px ${(cur.bfR*.32).toFixed(1)}px rgba(${r},${g},${b},${cur.bfA.toFixed(3)})`,
  ].join(",");

  if(!glReady||!renderer)return;
  const dt=Math.min(_clock.getDelta(),0.05);
  if(mixer)mixer.update(dt);
  if(globeHolder){
    // auto-rotate; spin faster when the daimon is active
    globeHolder.rotation.y+=(0.18+cur.spd*1.7)*dt;
  }
  // Pulse the hologram shell's glow with the daimon's heartbeat — but keep its
  // native cyan so it still reads as the model you made. State colour lives in
  // the surrounding halo (orbGlow) instead.
  const pulse=Math.sin(t*2*Math.PI/(tgt.pulsePer/1000))*.5+.5;
  if(shellMat){
    shellMat.emissiveIntensity=1.7+pulse*0.6+cur.turb*0.7;
  }
  renderer.render(scene,camera);
}

// ── daimon API (exact contract) ───────────────────────────────────────────────
const daimon = {
  setState(state) {
    if(!ST[state])return;
    prevName=tgtName; tgtName=state;
    applyStateExtras(state);
    if(state==="idle")setTimeout(()=>{chipsEl.innerHTML="";},800);
  },
  say(text,chunks)          { _appendMsg(text,"msg-daimon"); speakDaimon(text,chunks); },
  proposeAction(verb,risk)  {
    const c=document.createElement("div");
    c.className=`chip chip-${risk}`;
    c.textContent=verb.replace(/_/g,"​ ");
    chipsEl.appendChild(c);
  },
  requestGate(label) { gateAction.textContent=label||"Confirm action"; gateEl.classList.add("visible"); },
  closeGate()        { gateEl.classList.remove("visible"); },
};

function _appendMsg(text,cls) {
  const el=document.createElement("div");
  el.className=`msg ${cls}`; el.textContent=text;
  txEl.appendChild(el);
  requestAnimationFrame(()=>{txEl.scrollTop=txEl.scrollHeight;});
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
let ws=null, reconnTimer=null;

function connect() {
  ws=new WebSocket(WS_URL);
  ws.addEventListener("open",()=>{connDot.classList.add("ok");clearTimeout(reconnTimer);});
  ws.addEventListener("close",()=>{
    connDot.classList.remove("ok");
    daimon.setState("idle"); daimon.closeGate();
    reconnTimer=setTimeout(connect,2000);
  });
  ws.addEventListener("error",()=>ws.close());
  ws.addEventListener("message",({data})=>{
    let msg; try{msg=JSON.parse(data);}catch{return;}
    switch(msg.type){
      case "state":
        if(msg.state==="idle"){ serverBusy=false; _maybeResume(); }
        else if(msg.state!=="listening"){ serverBusy=true; }
        daimon.setState(msg.state);
        break;
      case "say":        daimon.say(msg.text,msg.chunks);         break;
      case "action":     daimon.proposeAction(msg.verb,msg.risk); break;
      case "gate":       daimon.requestGate(msg.label);           break;
      case "gate_close": daimon.closeGate();                      break;
      case "model":      if(msg.model)modelSelect.value=msg.model; break;

      case "term_open":
        _openTerm();
        daimon.setState("acting");
        break;

      case "term":
        if(msg.data){
          // Auto-open panel if server sends data without explicit term_open (reconnect)
          if(!termPanelEl.classList.contains("visible"))_openTerm();
          if(term) term.write(Uint8Array.from(atob(msg.data), c=>c.charCodeAt(0)));
          // Orb reacts to activity: acting while output flows, listening when quiet
          daimon.setState("acting");
          clearTimeout(termActivityTimer);
          termActivityTimer=setTimeout(()=>{
            if(termPanelEl.classList.contains("visible"))daimon.setState("listening");
          },1600);
        }
        break;

      case "term_close":
        _closeTerm();
        break;
    }
  });
}

// ── Input ─────────────────────────────────────────────────────────────────────
function _resizeInput(){
  inputEl.style.height="auto";
  inputEl.style.height=Math.min(inputEl.scrollHeight,160)+"px";
}

function sendMessage() {
  const text=inputEl.value.trim();
  if(!text||!ws||ws.readyState!==WebSocket.OPEN)return;
  inputEl.value=""; inputEl.style.height="auto";
  springNudge(0.055);
  _appendMsg(text,"msg-user");
  ws.send(JSON.stringify({type:"user",text}));
  daimon.setState("thinking");
}

sendBtn.addEventListener("click",sendMessage);
modelSelect.addEventListener("change",()=>{
  if(ws && ws.readyState===WebSocket.OPEN)
    ws.send(JSON.stringify({type:"set_model",model:modelSelect.value}));
});
inputEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
inputEl.addEventListener("focus",()=>{focusBoost=0.9;});
inputEl.addEventListener("blur",()=>{focusBoost=0;});
inputEl.addEventListener("input",()=>{_resizeInput();springNudge(0.008);});

document.addEventListener("touchstart",e=>{
  if(!inputEl.contains(e.target)&&!sendBtn.contains(e.target))inputEl.blur();
},{passive:true});

// ── Voice: hands-free conversation (speech-to-text in, speech out) ────────────
// Tap the mic to start a conversation. Daimon then keeps listening on its own:
// you speak → it replies (aloud) → it listens again, no button presses. Tap the
// mic again (or it auto-stops on permission denial) to end the conversation.
const _SR    = window.SpeechRecognition || window.webkitSpeechRecognition;
const _synth = window.speechSynthesis || null;
let convoMode=false, recog=null, recogActive=false;
let speaking=false, awaitingReply=false, serverBusy=false;
let listenTimer=null, fallbackTimer=null;

if(!_SR) micBtn.style.display="none";   // no speech recognition → hide the mic

function _buildRecog(){
  const r=new _SR();
  r.lang="en-US"; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
  r.onstart=()=>{ recogActive=true; if(convoMode&&!speaking)daimon.setState("listening"); };
  r.onresult=(e)=>{
    let interim="", final="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      if(res.isFinal) final+=res[0].transcript; else interim+=res[0].transcript;
    }
    if(interim){ inputEl.value=interim; _resizeInput(); }
    if(final.trim()){ inputEl.value=final.trim(); _resizeInput(); _onUtterance(); }
  };
  r.onerror=(e)=>{
    recogActive=false;
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ stopConvo(); return; }
    if(convoMode && !speaking && !awaitingReply) _scheduleListen(500);
  };
  r.onend=()=>{
    recogActive=false;
    if(convoMode && !speaking && !awaitingReply) _scheduleListen(250);
  };
  return r;
}

function _scheduleListen(d){ clearTimeout(listenTimer); listenTimer=setTimeout(_startListen,d||200); }
function _startListen(){
  if(!convoMode || speaking || recogActive) return;
  try{ recog.start(); }catch(_){ /* start races with a pending stop — ignore */ }
}
function _stopListen(){ try{ recog && recog.abort(); }catch(_){} recogActive=false; }

function _onUtterance(){
  const text=inputEl.value.trim();
  if(!text) return;
  _stopListen();
  awaitingReply=true; serverBusy=true;
  clearTimeout(fallbackTimer);
  fallbackTimer=setTimeout(()=>{ awaitingReply=false; if(convoMode&&!speaking)_scheduleListen(300); },14000);
  sendMessage();                       // appends, sends, sets "thinking"
}

function _maybeResume(){
  // Resume listening only once the server is done AND Daimon has finished talking.
  if(convoMode && awaitingReply && !speaking && !serverBusy){
    awaitingReply=false;
    clearTimeout(fallbackTimer);
    _scheduleListen(350);
  }
}

// Speaks the server-supplied chunks. The splitter lives server-side
// (mac_agent/chunking.py) and ships its output in the say event, so this path
// never re-implements it — and never truncates. It used to cut every utterance
// at 600 chars, silently dropping the tail of any long answer.
function speakDaimon(text,chunks){
  if(!convoMode || !_synth) return;
  const parts=(chunks&&chunks.length)?chunks:(text?[String(text)]:[]);
  if(!parts.length) return;
  _stopListen();                       // never let the mic hear Daimon's own voice
  speaking=true;
  daimon.setState("speaking");
  const done=()=>{
    if(_synth.speaking || _synth.pending) return;  // more queued — stay "speaking"
    speaking=false;
    _maybeResume();
  };
  for(const part of parts){
    const u=new SpeechSynthesisUtterance(part);
    u.lang="en-US"; u.rate=1.03; u.pitch=1.0;
    u.onend=done;
    try{ _synth.speak(u); }catch(_){ speaking=false; _maybeResume(); return; }
  }
}

function startConvo(){
  if(!_SR) return;
  convoMode=true;
  micBtn.classList.add("recording");
  micBtn.setAttribute("aria-label","End conversation");
  if(ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:"voice",on:true}));
  if(_synth){ try{ _synth.cancel(); _synth.speak(new SpeechSynthesisUtterance("")); }catch(_){} } // unlock iOS audio
  _scheduleListen(150);
}
function stopConvo(){
  convoMode=false; awaitingReply=false; speaking=false;
  micBtn.classList.remove("recording");
  micBtn.setAttribute("aria-label","Start conversation");
  clearTimeout(listenTimer); clearTimeout(fallbackTimer);
  _stopListen();
  if(_synth){ try{ _synth.cancel(); }catch(_){} }
  if(ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:"voice",on:false}));
  daimon.setState("idle");
}

if(_SR){
  recog=_buildRecog();
  micBtn.addEventListener("click",()=>{ convoMode ? stopConvo() : startConvo(); });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
resizeCanvas();
glReady=initGL();
if(!glReady)canvas.classList.add("no-webgl");
window.addEventListener("resize",()=>{
  resizeCanvas();
  if(termPanelEl.classList.contains("visible")){
    if(fitAddon)try{fitAddon.fit();}catch(_){}
    _sendResize();
  }
});
requestAnimationFrame(draw);
connect();
</script>
</body>
</html>
