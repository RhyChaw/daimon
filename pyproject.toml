[project]
name = "mac-agent"
version = "0.0.1"
description = "A local-first, gated computer-use agent for macOS (v0)."
requires-python = ">=3.10"

[project.scripts]
macagent = "mac_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mac_agent"]

[tool.setuptools.package-data]
mac_agent = ["scripts/*.applescript"]
